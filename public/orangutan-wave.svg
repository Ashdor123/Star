  <ellipse cx="28" cy="62" rx="4" ry="13" fill="#d4a574"/>
  <ellipse cx="35" cy="68" rx="4" ry="10" fill="#d4a574"/>
  
  <!-- 右臂 -->
  <ellipse cx="165" cy="140" rx="20" ry="40" fill="#3d2914"/>
  
  <!-- 右手掌 -->
  <ellipse cx="175" cy="175" rx="15" ry="18" fill="#d4a574"/>
  
  <!-- 左腿 -->
  <ellipse cx="70" cy="210" rx="25" ry="35" fill="#3d2914"/>
  
  <!-- 右腿 -->
  <ellipse cx="130" cy="210" rx="25" ry="35" fill="#3d2914"/>
  
  <!-- 左脚 -->
  <ellipse cx="65" cy="235" rx="22" ry="12" fill="#d4a574"/>
  
  <!-- 右脚 -->
  <ellipse cx="135" cy="235" rx="22" ry="12" fill="#d4a574"/>
  
  <!-- 耳朵 -->
