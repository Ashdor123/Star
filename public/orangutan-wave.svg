  <circle cx="85" cy="68" r="5" fill="#1a1a1a"/>
  <circle cx="115" cy="68" r="5" fill="#1a1a1a"/>
  
  <!-- 鼻子 -->
  <ellipse cx="100" cy="85" rx="12" ry="8" fill="#2d1f0f"/>
  
  <!-- 嘴巴 -->
  <path d="M 85 95 Q 100 105 115 95" stroke="#2d1f0f" stroke-width="3" fill="none"/>
  
  <!-- 左臂（挥手） -->
  <ellipse cx="35" cy="120" rx="20" ry="45" fill="#3d2914" transform="rotate(-30 35 120)"/>
  
  <!-- 左手掌 -->
  <ellipse cx="20" cy="80" rx="18" ry="22" fill="#d4a574"/>
  
  <!-- 手指 -->
  <ellipse cx="12" cy="65" rx="4" ry="12" fill="#d4a574"/>
