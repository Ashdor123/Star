<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- 身体 -->
  <ellipse cx="100" cy="160" rx="60" ry="70" fill="#3d2914"/>
  
  <!-- 肚子 -->
  <ellipse cx="100" cy="165" rx="45" ry="50" fill="#d4a574"/>
  
  <!-- 头部 -->
  <ellipse cx="100" cy="70" rx="45" ry="40" fill="#3d2914"/>
  
  <!-- 脸部 -->
