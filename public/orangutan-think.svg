<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- 身体 -->
  <ellipse cx="100" cy="160" rx="60" ry="70" fill="#6b7280"/>
  
  <!-- 肚子 -->
  <ellipse cx="100" cy="165" rx="45" ry="50" fill="#9ca3af"/>
  
  <!-- 头部 -->
  <ellipse cx="100" cy="70" rx="45" ry="40" fill="#6b7280"/>
  
  <!-- 脸部 -->
  <ellipse cx="100" cy="75" rx="35" ry="30" fill="#d1d5db"/>
  
  <!-- 眉毛（思考表情） -->
  <path d="M 75 55 Q 85 50 95 55" stroke="#4b5563" stroke-width="3" fill="none"/>
  <path d="M 105 55 Q 115 50 125 55" stroke="#4b5563" stroke-width="3" fill="none"/>
  
  <!-- 眼睛（半闭思考状） -->
  <path d="M 80 65 Q 85 68 90 65" stroke="#1f2937" stroke-width="2" fill="none"/>
  <path d="M 110 65 Q 115 68 120 65" stroke="#1f2937" stroke-width="2" fill="none"/>
  
  <!-- 鼻子 -->
  <ellipse cx="100" cy="85" rx="10" ry="6" fill="#4b5563"/>
  
  <!-- 嘴巴（严肃思考状） -->
  <path d="M 90 100 Q 100 98 110 100" stroke="#4b5563" stroke-width="2" fill="none"/>
  
  <!-- 左手（托腮思考） -->
  <ellipse cx="55" cy="110" rx="18" ry="35" fill="#6b7280" transform="rotate(-20 55 110)"/>
  
  <!-- 左手掌（托腮） -->
  <ellipse cx="45" cy="80" rx="20" ry="22" fill="#d1d5db"/>
  <ellipse cx="40" cy="75" rx="8" ry="10" fill="#d1d5db"/>
  <ellipse cx="48" cy="72" rx="7" ry="11" fill="#d1d5db"/>
  <ellipse cx="56" cy="75" rx="6" ry="9" fill="#d1d5db"/>
  
  <!-- 右臂（抱胸） -->
  <ellipse cx="155" cy="130" rx="18" ry="40" fill="#6b7280" transform="rotate(20 155 130)"/>
  
  <!-- 右手掌 -->
  <ellipse cx="165" cy="165" rx="15" ry="18" fill="#d1d5db"/>
  
  <!-- 左腿 -->
  <ellipse cx="70" cy="210" rx="25" ry="35" fill="#6b7280"/>
  
  <!-- 右腿 -->
  <ellipse cx="130" cy="210" rx="25" ry="35" fill="#6b7280"/>
  
  <!-- 左脚 -->
  <ellipse cx="65" cy="235" rx="22" ry="12" fill="#9ca3af"/>
  
  <!-- 右脚 -->
  <ellipse cx="135" cy="235" rx="22" ry="12" fill="#9ca3af"/>
  
  <!-- 耳朵 -->
  <ellipse cx="55" cy="55" rx="10" ry="12" fill="#9ca3af"/>
  <ellipse cx="145" cy="55" rx="10" ry="12" fill="#9ca3af"/>
</svg>