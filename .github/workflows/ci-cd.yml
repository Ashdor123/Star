name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # 允许手动触发
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    # 前端构建
    - name: Install frontend dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build
      env:
        NODE_ENV: production

    - name: Verify dist directory
      run: |
        if [ -d "dist" ]; then
          echo "✅ dist directory exists"
          ls -la dist
          echo "dist size: $(du -sh dist | cut -f1)"
        else
          echo "❌ dist directory does not exist!"
          exit 1
        fi

    # 后端依赖安装
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    # 上传构建产物
    - name: Upload frontend build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: dist/
        retention-days: 7

    - name: Upload backend code
      uses: actions/upload-artifact@v4
      with:
        name: backend-code
        path: backend/
        retention-days: 7

  # 部署任务
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 只在 push 到 main/master 时部署，不在 pull_request 时部署
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 下载构建产物
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: dist/

    - name: Download backend code
      uses: actions/download-artifact@v4
      with:
        name: backend-code
        path: backend/

    - name: List downloaded files
      run: |
        echo "Frontend files:"
        ls -la dist/
        echo "Backend files:"
        ls -la backend/

    # 检查 Secrets 是否配置
    - name: Check secrets configuration
      run: |
        echo "Checking secrets..."
        if [ -z "${{ secrets.ALIYUN_ECS_HOST }}" ]; then
          echo "❌ ALIYUN_ECS_HOST is not set"
          exit 1
        else
          echo "✅ ALIYUN_ECS_HOST is set"
        fi
        
        if [ -z "${{ secrets.ALIYUN_ECS_USER }}" ]; then
          echo "❌ ALIYUN_ECS_USER is not set"
          exit 1
        else
          echo "✅ ALIYUN_ECS_USER is set"
        fi
        
        if [ -z "${{ secrets.ALIYUN_ECS_SSH_KEY }}" ]; then
          echo "❌ ALIYUN_ECS_SSH_KEY is not set"
          exit 1
        else
          echo "✅ ALIYUN_ECS_SSH_KEY is set"
        fi

    # 测试服务器连接
    - name: Test SSH connection
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ALIYUN_ECS_HOST }}
        username: ${{ secrets.ALIYUN_ECS_USER }}
        key: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
        script: |
          echo "✅ SSH connection successful"
          echo "Server: $(hostname)"
          echo "Time: $(date)"
          echo "Uptime: $(uptime)"

    # 部署前端
    - name: Deploy frontend to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ALIYUN_ECS_HOST }}
        username: ${{ secrets.ALIYUN_ECS_USER }}
        key: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
        source: "dist/*"
        target: ${{ secrets.ALIYUN_ECS_TARGET_DIR || '/www/wwwroot/star-sign-language/dist' }}
        strip_components: 1
        overwrite: true

    # 部署后端
    - name: Deploy backend to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ALIYUN_ECS_HOST }}
        username: ${{ secrets.ALIYUN_ECS_USER }}
        key: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
        source: "backend/*"
        target: ${{ secrets.ALIYUN_ECS_BACKEND_DIR || '/www/wwwroot/star-sign-language-backend' }}
        strip_components: 1
        overwrite: true

    # 部署部署脚本
    - name: Deploy deploy script
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ALIYUN_ECS_HOST }}
        username: ${{ secrets.ALIYUN_ECS_USER }}
        key: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
        source: "deploy.sh"
        target: ${{ secrets.ALIYUN_ECS_BACKEND_DIR || '/www/wwwroot/star-sign-language-backend' }}
        overwrite: true

    # 执行部署脚本
    - name: Execute deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ALIYUN_ECS_HOST }}
        username: ${{ secrets.ALIYUN_ECS_USER }}
        key: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
        script: |
          echo "========================================"
          echo "Starting deployment..."
          echo "========================================"
          
          BACKEND_DIR="${{ secrets.ALIYUN_ECS_BACKEND_DIR || '/www/wwwroot/star-sign-language-backend' }}"
          
          echo "Backend directory: $BACKEND_DIR"
          
          # 检查目录是否存在